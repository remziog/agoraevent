name: QA Evidence Validation

on:
  pull_request:
    paths:
      - 'docs/qa/evidence/**'
      - 'scripts/qa/collect-getting-there-evidence.py'
      - '.github/workflows/qa-evidence-validation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/evidence/**'
      - 'scripts/qa/collect-getting-there-evidence.py'
  workflow_dispatch:

jobs:
  validate-evidence:
    name: Validate "Getting There" evidence sessions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the report can diff against the PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: pip install --quiet 'jsonschema>=4.18'

      - name: Resolve diff base
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate all evidence sessions
        id: validate
        continue-on-error: true
        run: |
          mkdir -p .qa-report
          python scripts/qa/collect-getting-there-evidence.py \
            --validate --all \
            --report .qa-report/evidence-validation-report.md \
            --report-json .qa-report/evidence-validation-report.json \
            --base-ref "${{ steps.base.outputs.ref }}"

      - name: Validate JSON report against schema
        id: schema
        if: always()
        run: |
          python scripts/qa/validate-report-schema.py \
            .qa-report/evidence-validation-report.json \
            docs/qa/schemas/evidence-validation-report.schema.json

      - name: Fail build if evidence validation failed
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::Evidence session validation failed (see qa-evidence-validation-report artifact)."
          exit 1

      - name: Upload validation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-validation-report
          path: .qa-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### QA Evidence Validation" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "All evidence sessions under \`docs/qa/evidence/\` passed strict validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "One or more evidence sessions failed validation." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **qa-evidence-validation-report** artifact (top of this run) for per-session errors and diffs against \`${{ steps.base.outputs.ref }}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Reproduce locally:" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "python scripts/qa/collect-getting-there-evidence.py --validate --all \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --report report.md --base-ref ${{ steps.base.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
